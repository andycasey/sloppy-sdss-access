name: Release

# Publishes to PyPI. Three ways in:
#
#   1. a v* tag pushed by hand:
#        git tag -a v0.1.2 -m "v0.1.2" && git push origin v0.1.2
#   2. update-registry.yml calling this workflow after it bumps and tags,
#      so a registry rebuild reaches PyPI in the same run;
#   3. workflow_dispatch, to rehearse everything except the upload.
#
# Called or pushed, the tag is the unit of work: `inputs.tag` when called,
# `github.ref_name` otherwise. Everything below reads that one expression, so
# the two paths cannot drift.
#
# Authentication is PyPI Trusted Publishing (OIDC) -- there is no API token
# stored in this repository. See the one-time setup note at the bottom of this
# file; without it, the publish step fails with an authentication error.

on:
  push:
    tags:
      - "v*"
  # Called by update-registry.yml. PyPI resolves the OIDC claim to the
  # TOP-LEVEL workflow, so a publish through this path authenticates as
  # update-registry.yml, which needs its own trusted publisher -- see the
  # setup note at the bottom.
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.2.0"
        required: true
        type: string
  # Lets you rehearse everything except the upload.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # The tag being released, whichever way we got here.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ------------------------------------------------------------------
  # Everything that can fail should fail here, before anything is uploaded.
  # A PyPI version number can never be reused, so a bad publish is permanent.
  # ------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # When called, the caller's ref is a branch; the tag is what we mean.
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install (with the real sdss-access, for the differential check)
        run: |
          pip install -e ".[dev]"
          pip install sdss-access

      - name: Tag must match the packaged version
        if: startsWith(inputs.tag || github.ref_name, 'v')
        run: |
          python - <<'PY'
          import os, pathlib, re, sys, tomllib

          tag = os.environ["TAG"].lstrip("v")
          pkg = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          init = pathlib.Path("src/sloppy_sdss_access/__init__.py").read_text()
          dunder = re.search(r'__version__ = "([^"]+)"', init).group(1)

          print(f"tag={tag}  pyproject={pkg}  __version__={dunder}")
          problems = []
          if tag != pkg:
              problems.append(f"tag v{tag} != pyproject.toml {pkg}")
          if tag != dunder:
              problems.append(f"tag v{tag} != __version__ {dunder}")
          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
          PY

      - name: Tests
        run: pytest -q

      - name: Registry matches its source configs
        run: python tools/build_registry.py --check

      - name: Differential check against sdss-access
        run: python tools/parity_check.py

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: The built wheel must actually work
        # Guards the failure mode that shipped in 0.1.0: a wheel that imports
        # fine but carries a broken registry.
        #
        # The question is whether the WHEEL agrees with the checkout it was
        # built from, so that is what is compared -- rather than counting
        # releases and products against numbers written here, which go stale
        # the moment sdss/tree adds anything and then fail a release for a
        # reason that has nothing to do with the wheel.
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install dist/*.whl

          # What the source checkout resolves, from outside the venv.
          python - <<'PY' > /tmp/expected.json
          import json
          from sloppy_sdss_access import SDSS, known_releases, load
          json.dump({
              "counts": {name: len(load(name)) for name in known_releases()},
              "path": SDSS("dr19").path("astraAllStarASPCAP"),
          }, open("/dev/stdout", "w"))
          PY

          /tmp/wheelcheck/bin/python - <<'PY'
          import json
          from sloppy_sdss_access import SDSS, known_releases, load

          expected = json.load(open("/tmp/expected.json"))
          counts = {name: len(load(name)) for name in known_releases()}

          assert counts == expected["counts"], (
              f"wheel registry differs from the checkout it was built from:\n"
              f"  wheel:    {counts}\n  checkout: {expected['counts']}"
          )
          # A registry that loads but resolves nothing would pass the counts.
          got = SDSS("dr19").path("astraAllStarASPCAP")
          assert got == expected["path"], f"{got} != {expected['path']}"
          print(f"wheel OK: {len(counts)} releases, {sum(counts.values())} products")
          print(f"          {got}")
          PY

      - name: The builder must not destroy the shipped registry
        # Regression test for the 0.1.0 defect, exercised against the real wheel.
        # "Destroyed" is measured against what the wheel had a moment ago, not
        # against a number that has to be maintained here.
        run: |
          export XDG_CACHE_HOME=/tmp/emptycache
          count() { /tmp/wheelcheck/bin/python -c "
          from sloppy_sdss_access import known_releases, load
          print(sum(len(load(name)) for name in known_releases()))"; }

          before="$(count)"
          /tmp/wheelcheck/bin/sloppy-sdss-access-build-registry && rc=0 || rc=$?
          if [ "${rc:-0}" -eq 0 ]; then
            echo "::error::Bare invocation should refuse without source configs"
            exit 1
          fi
          after="$(count)"

          if [ "$before" != "$after" ]; then
            echo "::error::Registry damaged: $before product definitions before the"
            echo "::error::bare invocation, $after after."
            exit 1
          fi
          echo "registry intact after bare invocation: $after product definitions"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # ------------------------------------------------------------------
  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Only on a real tag -- pushed or handed to us -- and never on a dry run.
    if: startsWith(inputs.tag || github.ref_name, 'v') && github.event.inputs.dry_run != 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/sloppy-sdss-access/
    permissions:
      id-token: write     # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PEP 740 attestations are signed with the identity of the workflow
          # that STARTED the run, and PyPI verifies that against the trusted
          # publisher. On a hand-pushed tag that is release.yml and it matches.
          # When update-registry.yml calls this workflow it is the top-level
          # one, so the attestation is stamped
          #     .../update-registry.yml@refs/heads/main
          # and PyPI rejects the upload:
          #     does not match expected Trusted Publisher (release.yml @ ...)
          #     HTTPError: 400 Bad Request
          # Authentication is fine either way -- update-registry.yml has its own
          # trusted publisher -- it is only the signature that is pinned. So the
          # automated path uploads unattested, and a hand-pushed tag still
          # attests. Dispatching this workflow at the tag instead of calling it
          # would keep attestations on both paths, at the cost of the release
          # being a second, separate run.
          attestations: ${{ inputs.tag == '' }}

  # ------------------------------------------------------------------
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # Needed so the annotated tag object (and its message) is available;
          # the default shallow fetch does not bring tag contents with it.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release from the tag message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(git tag -l --format='%(contents)' "$TAG")
          if [ -z "$notes" ]; then
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes "$notes"
          fi

# ----------------------------------------------------------------------
# ONE-TIME SETUP (required before the first tag-triggered publish)
#
# 1. https://pypi.org/manage/project/sloppy-sdss-access/settings/publishing/
#    Add TWO trusted publishers, both with:
#        Owner:            andycasey
#        Repository:       sloppy-sdss-access
#        Environment name: pypi
#    differing only in the workflow name:
#        Workflow name:    release.yml            (a tag pushed by hand)
#        Workflow name:    update-registry.yml    (the weekly registry bump)
#
#    Two, because PyPI resolves the OIDC claim to the workflow that STARTED
#    the run, not the one containing the publish job -- "Reusable workflows
#    cannot currently be used as the workflow in a Trusted Publisher"
#    (https://docs.pypi.org/trusted-publishers/troubleshooting/). Until the
#    second one exists, the weekly bump verifies and then fails on upload.
#
# 2. GitHub → Settings → Environments → New environment → "pypi"
#    Optionally add yourself as a required reviewer, which makes every publish
#    pause for manual approval.
#
# Until step 1 is done, `verify` passes and `publish` fails on authentication.
# ----------------------------------------------------------------------

name: Update registry from sdss/tree

# The registry is a build artifact of sdss/tree. This keeps it fresh without
# anyone having to remember: it rebuilds weekly from sdss/tree's newest release
# TAG and commits straight to main, but only when the compiled output actually
# changes.
#
# Tag, not `main`: a tag is something upstream chose to publish, so a registry
# can say which tree release it came from, and two builds a day apart are
# comparable. A new tree tag is also what drives this package's version -- see
# the version step below.
#
# The bump is tagged and released in the same run: the `release` job below calls
# release.yml, so a registry rebuild reaches PyPI without anyone having to
# notice it landed. release.yml still does the verifying -- the blocking parity
# check against sdss_access, the tag/version agreement, the wheel smoke tests --
# and still publishes through the `pypi` environment, which is where a required
# reviewer goes if an unattended publish is not wanted.
#
# NOTE: PyPI resolves the OIDC claim to the workflow that STARTED the run, so a
# publish through this path authenticates as `update-registry.yml`, not
# `release.yml`. It needs its own trusted publisher; see the setup note at the
# bottom of release.yml.
#
# This used to open a PR, on the reasoning that a tree change can alter
# thousands of paths and deserves a human diff. It never worked: GitHub Actions
# is not permitted to create pull requests unless the repository opts in
# (Settings -> Actions -> General -> "Allow GitHub Actions to create and approve
# pull requests"), so every scheduled run pushed a `registry-update` branch and
# then failed on the PR call, and the update never landed. Committing directly
# is the honest version of what the job can actually do. The safety net is that
# nothing is pushed until the rebuilt registry is self-consistent AND the test
# suite passes against it; `git log -- src/sloppy_sdss_access/data/registry.json`
# is where you read the diff afterwards.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Hourly. GitHub cannot subscribe to another repository's events, so a new
    # sdss/tree tag can only be noticed by looking -- and the `poll` job below
    # makes looking cost one `git ls-remote`, so looking often is free.
    - cron: "17 * * * *"
  # ...unless sdss/tree tells us, which it can: see "Being told instead of
  # looking" in docs/content/docs/registry.md for the workflow that goes at
  # their end. Note this arrives on the DEFAULT BRANCH only -- that is how
  # repository_dispatch works -- and it still goes through `poll`, so a ping
  # for a tag we have already built is correctly a no-op.
  repository_dispatch:
    types: [tree-tagged]
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref of sdss/tree to build from (tag, branch, SHA, or 'latest')"
        default: "latest"
        required: false
      dry_run:
        description: "Rebuild and report what would happen; commit nothing, tag nothing, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Has sdss/tree tagged something we have not built from? Answering costs one
  # `git ls-remote` and no install -- tools/build_registry.py puts src/ on
  # sys.path itself and imports nothing outside the standard library -- so the
  # 8,759 hourly runs a year that find nothing cost seconds each, and the one
  # that finds a tag starts the rebuild within the hour.
  poll:
    # Not on every PR; those trigger check-consistency only.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.poll.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: poll
        run: |
          set -euo pipefail
          LATEST="$(python tools/build_registry.py --latest-tag)"
          BUILT="$(python -c "
          import json
          print(json.load(open('src/sloppy_sdss_access/data/registry.json'))['source'].get('ref') or '')")"
          echo "sdss/tree latest tag: ${LATEST}   registry built from: ${BUILT:-nothing}"
          if [ "$LATEST" = "$BUILT" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Up to date; nothing to rebuild."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::sdss/tree ${BUILT:-nothing} -> ${LATEST}; rebuilding."
          fi

  update:
    needs: poll
    # A new tree tag, or someone asking by hand (which may name any ref, and
    # means run whatever the poll thought).
    if: needs.poll.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # commit the registry, push the tag
    outputs:
      version: ${{ steps.commit.outputs.version }}
      tree_ref: ${{ steps.commit.outputs.tree_ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Rebuild registry from sdss/tree
        run: |
          python tools/build_registry.py \
            --fetch --ref "${{ github.event.inputs.ref || 'latest' }}" | tee build.log

      - name: Run tests against the new registry
        run: pytest -q

      # Parity needs the legacy stack; it is the real check that a tree change
      # did not silently alter path semantics. Non-blocking install so a broken
      # sdss-access release cannot wedge the update.
      - name: Differential check vs sdss_access
        continue-on-error: true
        run: |
          pip install sdss-access || exit 0
          SAS_BASE_DIR=/tmp/sas python tools/parity_check.py | tee parity.log

      # The registry must agree with the cfgs that were just fetched. This is the
      # same gate the check-consistency job applies to every PR, run here before
      # anything reaches main.
      - name: Check the rebuilt registry is self-consistent
        run: python tools/build_registry.py --check

      - name: Commit the rebuilt registry to main
        id: commit
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          REGISTRY=src/sloppy_sdss_access/data/registry.json
          PATHS="$REGISTRY tools"

          # --porcelain, not `git diff`: a release added upstream arrives as a
          # new, untracked cfg, which a diff of tracked files would not see.
          if [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "Registry unchanged; nothing to commit."
            exit 0
          fi

          # A dispatch defaults to a dry run, so "what would this do?" is
          # answerable without doing it.
          DRY="${{ github.event.inputs.dry_run }}"

          # The version follows the tree tag. A new tag is a new upstream
          # release: it can move any path in the archive, so it earns a minor
          # bump whether or not this particular tag changed much. Same tag with
          # a different payload means the tag was moved under us -- rare, but
          # the change still has to reach PyPI, so it takes a patch.
          ref() { python -c "import json,sys; print(json.load(sys.stdin)['source'].get('ref') or '')"; }
          OLD_REF="$(git show "HEAD:$REGISTRY" | ref)"
          NEW_REF="$(ref < "$REGISTRY")"
          if [ "$OLD_REF" != "$NEW_REF" ]; then PART=minor; else PART=patch; fi
          CURRENT="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          WOULD_BE="$(python -c "import sys; sys.path.insert(0, 'src'); from sloppy_sdss_access._build import next_version; print(next_version('${CURRENT}', '${PART}'))")"

          echo "sdss/tree ${OLD_REF:-none} -> ${NEW_REF} : ${PART} bump, ${CURRENT} -> ${WOULD_BE}"
          git --no-pager diff --stat -- $PATHS
          git status --porcelain -- $PATHS

          if [ "$DRY" = "true" ]; then
            echo "::notice::Dry run: would commit the above, tag v${WOULD_BE}, and release it."
            echo "::notice::Re-run with dry_run unchecked to do it."
            exit 0
          fi

          # `git push origin HEAD:main` from a feature branch would push that
          # whole branch to main. A dispatch can name any branch, so refuse
          # rather than trust the operator to have picked the right one.
          if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "::error::Refusing to commit to ${DEFAULT_BRANCH} from ${GITHUB_REF_NAME}."
            echo "::error::Run this on ${DEFAULT_BRANCH}, or leave dry_run checked."
            exit 1
          fi

          VERSION="$(python tools/build_registry.py --bump "$PART")"
          [ "$VERSION" = "$WOULD_BE" ] || { echo "::error::bump disagreed: $VERSION"; exit 1; }

          {
            echo "Rebuild registry from sdss/tree@${NEW_REF} (v${VERSION})"
            echo
            echo "sdss/tree ${OLD_REF:-none} -> ${NEW_REF}, so ${PART} bump to ${VERSION}."
            echo
            grep " products" build.log || true
            echo
            echo "Full build log: ${RUN_URL}"
          } > commit-message.txt

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $PATHS pyproject.toml src/sloppy_sdss_access/__init__.py
          git commit -F commit-message.txt

          # The branch can move while a build runs; rebase onto it rather than
          # failing. The `if` keeps `set -e` from killing the loop on a miss.
          pushed=
          for attempt in 1 2 3; do
            if git pull --rebase origin "$DEFAULT_BRANCH" \
               && git push origin "HEAD:$DEFAULT_BRANCH"; then
              pushed=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          [ -n "$pushed" ] || exit 1

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tree_ref=${NEW_REF}" >> "$GITHUB_OUTPUT"

      # A tag is what release.yml publishes from, and its message becomes the
      # GitHub release notes -- so it is written to be read, not just to exist.
      - name: Tag the bump
        if: steps.commit.outputs.version != ''
        env:
          VERSION: ${{ steps.commit.outputs.version }}
          TREE_REF: ${{ steps.commit.outputs.tree_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Belt and braces: the step's `if` already skips an empty version,
          # and a tag literally named "v" is not a mistake worth making twice.
          [ -n "${VERSION}" ] || { echo "::error::no version to tag"; exit 1; }
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} already exists. A PyPI version cannot be reused;"
            echo "::error::sort out the duplicate by hand rather than moving the tag."
            exit 1
          fi

          {
            echo "${TAG}"
            echo
            echo "Registry rebuilt from sdss/tree@${TREE_REF}."
            echo
            grep " products" build.log || true
            echo
            echo "Build log: ${RUN_URL}"
          } > tag-message.txt

          git tag -a "${TAG}" -F tag-message.txt
          git push origin "${TAG}"
          echo "Tagged ${TAG}; the release job takes it from here."

  # Build and publish that tag, in this same run. Calling release.yml rather
  # than duplicating it means there is exactly one path to PyPI, whether the
  # tag came from this job or from someone's terminal.
  release:
    needs: update
    if: needs.update.outputs.version != ''
    permissions:
      contents: write     # github-release creates the release from the tag
      id-token: write     # PyPI Trusted Publishing
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.update.outputs.version }}

  # Separately, fail CI on any PR whose committed registry does not match its
  # vendored cfgs -- i.e. someone edited a cfg but forgot to rebuild. Unlike the
  # `update` job, this has no `if:` guard, so the top-level `pull_request` / `push`
  # triggers run it on every PR and every push to main. (Not on the `update`
  # job's own push: commits made with GITHUB_TOKEN do not trigger workflows, so
  # there is no loop -- which is why that job runs the same check inline.)
  check-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python tools/build_registry.py --check
